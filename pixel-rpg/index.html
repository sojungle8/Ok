<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>微光大陸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Silkscreen&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="lvbox"><span class="lbl">Lv</span><b id="lv">1</b></div>
    <div class="bars">
      <div class="bar hp"><i id="hpBar"></i><span><em>HP</em> <b id="hpText">0</b></span></div>
      <div class="bar xp"><i id="xpBar"></i><span><em>EXP</em> <b id="xpText">0%</b></span></div>
    </div>
  </header>
  <div class="stats">
    <span class="stat cpstat" id="cpBox">戰鬥力 <b id="cp">0</b></span>
    <span class="stat" id="coinBox"><i class="dot gold"></i><b id="coins">0</b></span>
    <span class="tools">
      <button id="gearBtn" class="tbtn" type="button">裝備</button>
      <button id="fontBtn" class="tbtn" type="button">字級：大</button>
    </span>
  </div>
  <div class="stage">
    <canvas id="cv" width="960" height="1056" aria-label="遊戲畫面"></canvas>
    <div class="quest"><span class="qlbl">任務</span><span id="quest"></span></div>
    <div id="bossBar" class="bossbar" hidden><span>史萊姆王</span><div class="bb"><i id="bossFill"></i></div></div>
    <div id="combo" class="combo" hidden></div>
    <div id="cpPop" class="cppop"></div>
    <div id="banner" class="banner"></div>
    <div id="feed" class="feed" aria-live="polite"></div>
    <div id="dialog" class="dialog" hidden>
      <div class="who" id="dlgName"></div>
      <div class="text" id="dlgText"></div>
      <div class="opts" id="dlgOpts"></div>
      <div class="next" id="dlgNext">▼</div>
    </div>
    <div id="gearPanel" class="gearpanel" hidden>
      <h3>我的裝備</h3>
      <div id="gearList"></div>
      <button id="gearClose" class="startbtn" type="button">關閉</button>
    </div>
    <div id="title" class="title">
      <div class="logo">微光大陸<small>GLIMMERLAND</small></div>
      <div class="title-art" id="titleArt"></div>
      <button id="startBtn" class="startbtn" type="button">開始冒險</button>
      <p class="tip">按住「攻擊」連續砍・技能清怪・開「自動」掛機刷寶<br>鍵盤：方向鍵移動、空白鍵攻擊、Q／E 技能、X 藥水、R 自動</p>
    </div>
  </div>
  <div class="pad">
    <div class="padl">
      <button id="autoBtn" class="autobtn" type="button">自動 <b>OFF</b></button>
      <div class="dpad" aria-label="方向鍵">
        <button data-dir="up" class="u" aria-label="上">▲</button>
        <button data-dir="left" class="l" aria-label="左">◀</button>
        <button data-dir="right" class="r" aria-label="右">▶</button>
        <button data-dir="down" class="d" aria-label="下">▼</button>
      </div>
    </div>
    <div class="acts">
      <button id="meteorBtn" class="skill sk2" type="button" aria-label="流星雨">流星<em></em></button>
      <button id="spinBtn" class="skill sk1" type="button" aria-label="旋風斬">旋風<em></em></button>
      <button id="bBtn" class="skill pot" type="button" aria-label="喝藥水">藥水<small id="potions">3</small></button>
      <button id="aBtn" class="round a" type="button" aria-label="攻擊（按住連續攻擊）">攻擊</button>
    </div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
