<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>微光大陸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Silkscreen&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="lvbox"><span class="lbl">Lv</span><b id="lv">1</b></div>
    <div class="bars">
      <div class="bar hp"><i id="hpBar"></i><span><em>HP</em> <b id="hpText">14 / 14</b></span></div>
      <div class="bar xp"><i id="xpBar"></i><span><em>EXP</em> <b id="xpText">0 / 12</b></span></div>
    </div>
  </header>
  <div class="stats">
    <span class="stat"><i class="dot gold"></i>金幣 <b id="coins">0</b></span>
    <span class="stat"><i class="dot fish"></i>魚 <b id="fishN">0</b></span>
    <span class="stat"><i class="dot atk"></i>攻擊 <b id="atk">1</b></span>
    <button id="fontBtn" class="fontbtn" type="button">字級：大</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="960" height="1056" aria-label="遊戲畫面"></canvas>
    <div class="quest"><span class="qlbl">任務</span><span id="quest"></span></div>
    <div id="dialog" class="dialog" hidden>
      <div class="who" id="dlgName"></div>
      <div class="text" id="dlgText"></div>
      <div class="opts" id="dlgOpts"></div>
      <div class="next" id="dlgNext">▼</div>
    </div>
    <div id="title" class="title">
      <div class="logo">微光大陸<small>GLIMMERLAND</small></div>
      <div class="title-art" id="titleArt"></div>
      <button id="startBtn" class="startbtn" type="button">開始冒險</button>
      <p class="tip">方向鍵移動　A 攻擊／對話／釣魚　B 喝藥水<br>鍵盤：方向鍵或 WASD、空白鍵、X</p>
    </div>
  </div>
  <div class="pad">
    <div class="dpad" aria-label="方向鍵">
      <button data-dir="up" class="u" aria-label="上">▲</button>
      <button data-dir="left" class="l" aria-label="左">◀</button>
      <button data-dir="right" class="r" aria-label="右">▶</button>
      <button data-dir="down" class="d" aria-label="下">▼</button>
    </div>
    <div class="abtns">
      <button id="bBtn" class="round b" type="button" aria-label="喝藥水">B<small>藥水 <span id="potions">1</span></small></button>
      <button id="aBtn" class="round a" type="button" aria-label="攻擊或互動">A<small>行動</small></button>
    </div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
