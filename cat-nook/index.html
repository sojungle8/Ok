<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>喵喵小窩</title>
<meta name="description" content="收集原創貓咪、玩疊蛋糕小遊戲、做家具佈置你的貓咪小窩。">
<meta name="theme-color" content="#fff3ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hud">
  <span class="pill" title="金幣"><i data-icon="coin"></i><b id="coins">0</b></span>
  <span class="pill" title="餅乾"><i data-icon="cookie"></i><b id="cookies">0</b></span>
  <span id="mats" class="mats"></span>
</header>
<main>
  <section id="tab-room" class="tab active">
    <div class="room" id="room"><div class="roomwrap" id="roomBg"></div></div>
    <p class="hint">舒適度 <b id="comfort">0</b>　點貓咪摸摸牠，每天前 8 次會送餅乾</p>
  </section>
  <section id="tab-cats" class="tab">
    <div class="panel summon">
      <div class="summon-art" id="summonArt"></div>
      <div>
        <button id="summon" class="btn">召喚貓咪 <span class="price"><i data-icon="coin"></i>100</span></button>
        <p class="small muted">機率　普通 60%・稀有 28%・史詩 10%・傳說 2%<br>保底 <b id="pity">0</b>/10，第 10 抽必出史詩以上。重複的貓換成 3 塊餅乾。</p>
      </div>
    </div>
    <div id="catGrid" class="grid"></div>
  </section>
  <section id="tab-game" class="tab">
    <div class="title-row"><h2>疊疊蛋糕</h2><span class="small muted">3 層 ★　6 層 ★★　10 層 ★★★</span></div>
    <div class="stage">
      <canvas id="stack" width="720" height="920" aria-label="疊蛋糕小遊戲"></canvas>
      <div id="baker" class="baker"></div>
    </div>
    <button id="play" class="btn">開始遊戲</button>
    <div id="gameResult" class="panel result" hidden></div>
  </section>
  <section id="tab-shop" class="tab">
    <h3>材料 <span class="small muted">小遊戲和任務也會隨機掉落</span></h3>
    <div id="matShop" class="matgrid"></div>
    <h3>家具藍圖 <span class="small muted">購買前就能看到配方</span></h3>
    <div id="bpList" class="bplist"></div>
  </section>
  <section id="tab-quests" class="tab">
    <h3>每日任務 <span class="small muted">每天換新，全部都能從零完成</span></h3>
    <div id="questList" class="qlist"></div>
  </section>
</main>
<nav class="tabs">
  <button data-tab="room" class="on"><i data-icon="home"></i><span>小窩</span></button>
  <button data-tab="cats"><i data-icon="paw"></i><span>貓咪</span></button>
  <button data-tab="game"><i data-icon="cake"></i><span>遊戲</span></button>
  <button data-tab="shop"><i data-icon="hammer"></i><span>工坊</span></button>
  <button data-tab="quests"><i data-icon="list"></i><span>任務</span><em id="questDot" hidden></em></button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="reveal"><div class="rays"></div><div id="revealBody"></div><button class="btn" id="revealOk">好耶！</button></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
